name: Gerar Dashboard e Publicar no GitHub Pages

on:
    push:
        branches: ["main"]
    workflow_dispatch:

# Impede que dois deploys rodem ao mesmo tempo e dupliquem artefatos
concurrency:
    group: "pages"
    cancel-in-progress: true

permissions:
    contents: read
    pages: write
    id-token: write

jobs:
    # Job 1: Prepara os dados e gera o HTML
    build:
        runs-on: ubuntu-latest
        steps:
            - name: 📥 Clonar Repositório
              uses: actions/checkout@v4

            - name: 🐍 Configurar Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
                  cache: "pip"

            - name: 📦 Instalar Dependências
              run: |
                  python -m pip install --upgrade pip
                  pip install pandas plotly

            - name: ⚙️ Gerar Dashboard HTML
              run: python gerar_dashboard.py

            - name: 📂 Preparar arquivos para o Pages
              run: |
                  mkdir _site
                  cp index.html _site/

            - name: 🏗️ Fazer Upload do Artefato
              uses: actions/upload-pages-artifact@v3
              with:
                  path: _site/

    # Job 2: Pega o artefato gerado e publica no site
    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: 🚀 Fazer o Deploy no GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
